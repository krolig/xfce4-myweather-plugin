name: Build DEB & RPM Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-deb:
    name: Build DEB (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config dpkg-dev libxfce4panel-2.0-dev libgtk-3-dev libcurl4-openssl-dev nlohmann-json3-dev

      - name: Build .deb package
        run: make deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfce4-myweather-plugin-deb
          path: "*.deb"

  build-rpm:
    name: Build RPM & SRPM (EL9 / RED OS 8)
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable CRB & EPEL and install dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y gcc-c++ make pkgconfig rpm-build gtk3-devel xfce4-panel-devel libcurl-devel 'pkgconfig(nlohmann_json)' tar

      - name: Build .rpm and .src.rpm packages
        run: |
          make rpm
          make srpm

      - name: Upload .rpm and .src.rpm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xfce4-myweather-plugin-rpm
          path: |
            *.rpm
            *.src.rpm

  release:
    name: Create GitHub Release (on tag push)
    needs: [build-deb, build-rpm]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.src.rpm

